[project]
name = "renteria-sis"
version = "0.1.0"
description = "Sistema de reportes SIS: usuarios por rol y tickets con clave por área."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<6",
    "pillow>=12.3.0",
    "pymysql>=1.2.3",
]

[dependency-groups]
dev = [
    "django-extensions>=4.1",
]
